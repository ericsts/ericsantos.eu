# ---- schedulesyou.com ----
# Domínio próprio (NÃO é subdomínio de ericsantos.eu) — SaaS Laravel com
# tenants dinâmicos por subdomínio (ex: empresa.schedulesyou.com).
# nginx dentro do container (porta 8010) resolve assets/API internamente.
#
# ATENÇÃO — certificado wildcard ainda pendente:
# *.schedulesyou.com exige validação DNS-01 (HTTP-01 não cobre wildcard),
# então "certbot --nginx -d ..." sozinho NÃO cobre os subdomínios de tenant.
# O DNS desse domínio está na GoDaddy hoje, que não tem plugin oficial do
# certbot. Por isso o deploy inicial (2026-10-22) subiu só com certificado
# pro domínio raiz (schedulesyou.com + www), sem suporte a subdomínio de
# tenant via HTTPS ainda. Duas opções pra resolver depois:
#   a) migrar o DNS do domínio pra Cloudflare (grátis) e usar
#      certbot-dns-cloudflare — caminho recomendado, renovação automática;
#   b) usar o plugin comunitário certbot-dns-godaddy (menos mantido).

server {
    listen 80;
    server_name schedulesyou.com www.schedulesyou.com;

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
